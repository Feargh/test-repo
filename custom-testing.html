<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Portal Testing Dashboard</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="Stylesheet.css" />
	</head>
	<body>
		<div class="dashboard-container">
			<!-- Navigation will be inserted here by JavaScript -->

			<!-- Main Content -->
			<main class="main-content">
				<!-- Custom Testing Header Section -->
				<section class="bc-section">
					<!-- Add Panel Bar -->
					<div class="add-panel-bar glass">
						<h1 class="bc-title">Portal Testing</h1>
						<form class="add-panel-form" onsubmit="return addiFrame(event);">
							<div class="apf-group">
								<span class="apf-label">Environment</span>
								<div class="apf-segmented">
									<label class="apf-seg-item">
										<input
											type="radio"
											name="environment"
											value="uat"
											checked
										/>
										<span>UAT</span>
									</label>
									<label class="apf-seg-item">
										<input type="radio" name="environment" value="staging" />
										<span>Staging</span>
									</label>
									<label class="apf-seg-item">
										<input type="radio" name="environment" value="production" />
										<span>Live</span>
									</label>
									<label class="apf-seg-item">
										<input type="radio" name="environment" value="local" />
										<span>Local</span>
									</label>
								</div>
							</div>

							<div class="apf-divider"></div>

							<div class="apf-group apf-group--grow">
								<label class="apf-label" for="portalId">Portal ID</label>
								<input
									class="apf-input"
									type="text"
									name="portalId"
									id="portalId"
									placeholder="e.g. abc123"
								/>
							</div>

							<div class="apf-divider"></div>

							<div class="apf-group">
								<span class="apf-label">Test Mode</span>
								<div class="apf-segmented">
									<label class="apf-seg-item">
										<input type="radio" name="testing" value="false" checked />
										<span>Off</span>
									</label>
									<label class="apf-seg-item">
										<input type="radio" name="testing" value="true" />
										<span>On</span>
									</label>
								</div>
							</div>

							<button class="apf-add-btn" type="submit">+ Add iframe</button>
						</form>
					</div>
				</section>

				<!-- iFrame Container -->
				<div id="iframe-container" class="iframe-grid">
					<!-- Dynamically created iframes will appear here -->
				</div>
			</main>
		</div>

		<!-- Scripts -->
		<script src="navigation.js"></script>
		<script>
			//-- Initialize navigation for Custom Testing page
			document.addEventListener("DOMContentLoaded", function () {
				initializeNavigation("custom-testing");
			});
		</script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
		<script src="script.js"></script>
	</body>
</html>
